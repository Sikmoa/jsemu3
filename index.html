<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Service worker for SharedArrayBuffer cross-origin isolation -->
  <script src="./coi-serviceworker.js"></script>
  <title>3DS & PSP Web Emulator</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
    #launcher {
      position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #18181b; padding: 20px;
    }
    .card { background: #27272a; padding: 24px; border-radius: 12px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin: 0 0 8px 0; font-size: 20px; text-align: center; }
    select, input[type="file"], button {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; background: #18181b; color: #fff; font-size: 14px; cursor: pointer;
    }
    button.start-btn { background: #2563eb; border: none; font-weight: bold; }
    button.start-btn:hover { background: #1d4ed8; }
    .divider { text-align: center; font-size: 12px; color: #71717a; text-transform: uppercase; }
    #game-container { width: 100%; height: 100%; display: none; }
  </style>
</head>
<body>

  <!-- Launcher Menu -->
  <div id="launcher">
    <div class="card">
      <h2>Select a Game</h2>
      
      <!-- Option 1: GitHub-hosted ROMs -->
      <label for="hosted-select">Hosted ROMs:</label>
      <select id="hosted-select">
        <option value="">-- Choose a hosted game --</option>
        <!-- Place files under 100MB in your repository's /roms/ folder -->
        <option value="./roms/homebrew_demo.iso">Homebrew Demo (PSP)</option>
        <option value="./roms/sample_game.3ds">Sample Game (3DS)</option>
        <!-- For games > 100MB, paste your direct GitHub Release download URL -->
        <!-- <option value="https://github.com/<user>/<repo>/releases/download/v1.0/game.iso">Large Game (PSP)</option> -->
      </select>

      <div class="divider">or load from device</div>

      <!-- Option 2: Local ROM File Picker -->
      <input type="file" id="local-file" accept=".3ds,.cci,.cxi,.iso,.cso,.pbp,.zip,.7z" />

      <button class="start-btn" id="launch-btn" disabled>Launch Emulator</button>
    </div>
  </div>

  <!-- Emulator Viewport -->
  <div id="game-container">
    <div id="game" style="width: 100%; height: 100%;"></div>
  </div>

  <script>
    const hostedSelect = document.getElementById('hosted-select');
    const localFileInput = document.getElementById('local-file');
    const launchBtn = document.getElementById('launch-btn');

    let selectedGameUrl = null;
    let selectedFileName = '';

    hostedSelect.addEventListener('change', (e) => {
      if (e.target.value) {
        selectedGameUrl = e.target.value;
        selectedFileName = e.target.value;
        localFileInput.value = '';
        launchBtn.disabled = false;
      } else {
        selectedGameUrl = null;
        launchBtn.disabled = !localFileInput.files.length;
      }
    });

    localFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedGameUrl = URL.createObjectURL(file);
        selectedFileName = file.name;
        hostedSelect.value = '';
        launchBtn.disabled = false;
      } else {
        selectedGameUrl = null;
        launchBtn.disabled = !hostedSelect.value;
      }
    });

    launchBtn.addEventListener('click', () => {
      if (!selectedGameUrl) return;

      const ext = selectedFileName.split('.').pop().toLowerCase();
      let core = 'psp';
      if (['3ds', 'cci', 'cxi'].includes(ext)) {
        core = '3ds';
      } else if (['iso', 'cso', 'pbp'].includes(ext)) {
        core = 'psp';
      }

      // Configure EmulatorJS globals
      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = selectedGameUrl;
      window.EJS_pathtodata = './data/';

      // Switch view and mount EmulatorJS
      document.getElementById('launcher').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      const script = document.createElement('script');
      script.src = './app.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
